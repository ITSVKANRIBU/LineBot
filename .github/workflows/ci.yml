name: CI

on:
  push:
    branches: [ '3.0', develop ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # productionはHeroku上のJava 8で稼働している。
      # ビルドJDKを揃えないと、sourceCompatibility=1.8でも実行時の差分を拾えない。
      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Check
        run: ./gradlew --no-daemon check

      - name: Build Heroku artifact
        run: ./gradlew --no-daemon :sample-spring-boot-echo:bootJar

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/test'
          if-no-files-found: ignore
